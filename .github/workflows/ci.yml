name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  libs:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        lib: [geodomain, geospatial_core, data_engine, geolearn, geomemory, geoagent]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/miniconda3/pkgs
          key: conda-pkgs-${{ runner.os }}-${{ hashFiles('environment.yml') }}
          restore-keys: conda-pkgs-${{ runner.os }}-

      - name: Set up conda env
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          activate-environment: geospatial
          environment-file: environment.yml
          python-version: "3.12"

      - name: Install editable libs
        run: |
          # Order matters: each lib depends on the ones before it.
          pip install \
            -e libs/geodomain \
            -e libs/geospatial_core \
            -e libs/data_engine \
            -e libs/geolearn \
            -e libs/geomemory \
            -e libs/geoagent

      - name: Install geomemory optional dependencies
        if: matrix.lib == 'geomemory'
        # The lancedb extra currently references nonexistent PyPI package
        # pylancedb; install the actual distribution separately instead.
        run: |
          set -o pipefail
          # CI runs on CPU; the default torch wheel pulls in multi-GB CUDA libraries.
          pip install --no-cache-dir 'torch==2.7.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          # Newer Streamlit releases change AppTest form handling; use a
          # version verified against the legacy dashboard's e2e tests.
          if ! pip install --no-cache-dir -e 'libs/geomemory[docs,ui,vision]' 'lancedb>=0.5' 'streamlit==1.40.2' 2>&1 | tee /tmp/geomemory-install.log; then
            detail=$(tail -n 15 /tmp/geomemory-install.log)
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\n'/'%0A'}
            detail=${detail//$'\r'/'%0D'}
            echo "::error::Geomemory dependency installation failed: $detail"
            exit 1
          fi

      - name: Ruff on changed files only
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          if ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            BASE="HEAD"
          fi
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- "libs/${{ matrix.lib }}/src" 2>/dev/null | grep '\.py$' || true)
          if [ -n "$CHANGED" ]; then
            echo "Linting:"
            echo "$CHANGED"
            ruff check $CHANGED
          else
            echo "No changed source files in libs/${{ matrix.lib }} — skipping ruff"
          fi

      - name: Mypy on changed files only
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          if ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            BASE="HEAD"
          fi
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- "libs/${{ matrix.lib }}/src" 2>/dev/null | grep '\.py$' || true)
          if [ -n "$CHANGED" ]; then
            echo "Checking:"
            echo "$CHANGED"
            cd libs/${{ matrix.lib }}
            REL=$(echo "$CHANGED" | sed "s#libs/${{ matrix.lib }}/##")
            mypy --strict $REL
          else
            echo "No changed source files in libs/${{ matrix.lib }} — skipping mypy"
          fi

      - name: Pytest
        run: |
          set -o pipefail
          if ! python -m pytest libs/${{ matrix.lib }}/tests -q --tb=short 2>&1 | tee /tmp/lib-pytest.log; then
            detail=$(tail -n 60 /tmp/lib-pytest.log)
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\n'/'%0A'}
            detail=${detail//$'\r'/'%0D'}
            echo "::error::Library tests failed: $detail"
            exit 1
          fi

      - name: Pytest (geomemorytest consumer suite)
        if: matrix.lib == 'geomemory'
        # The 13-file consumer suite under libs/geomemory/geomemorytest/ exercises
        # the public facade as a downstream app would. It was never run by CI.
        run: |
          set -o pipefail
          cd libs/geomemory
          if ! python -m pytest geomemorytest -q --tb=short 2>&1 | tee /tmp/geomemorytest.log; then
            detail=$(tail -n 60 /tmp/geomemorytest.log)
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\n'/'%0A'}
            detail=${detail//$'\r'/'%0D'}
            echo "::error::geomemorytest consumer suite failed: $detail"
            exit 1
          fi

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/miniconda3/pkgs
          key: conda-pkgs-${{ runner.os }}-${{ hashFiles('environment.yml') }}
          restore-keys: conda-pkgs-${{ runner.os }}-

      - name: Set up conda env
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          activate-environment: geospatial
          environment-file: environment.yml
          python-version: "3.12"

      - name: Install editable libs
        run: |
          pip install \
            -e libs/geodomain \
            -e libs/geospatial_core \
            -e libs/data_engine \
            -e libs/geolearn \
            -e libs/geomemory \
            -e libs/geoagent \
            -e 'server[dev]'

      - name: Ruff
        run: conda run -n geospatial ruff check server/src server/tests

      - name: Mypy
        run: cd server && conda run -n geospatial mypy --strict src/

      - name: Pytest
        run: python -m pytest server/tests -q

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/miniconda3/pkgs
          key: conda-pkgs-${{ runner.os }}-${{ hashFiles('environment.yml') }}
          restore-keys: conda-pkgs-${{ runner.os }}-

      - name: Set up conda env
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          activate-environment: geospatial
          environment-file: environment.yml
          python-version: "3.12"

      - name: Install editable libs
        run: |
          pip install \
            -e libs/geodomain \
            -e libs/geospatial_core \
            -e libs/data_engine \
            -e libs/geolearn \
            -e libs/geomemory \
            -e libs/geoagent \
            -e server

      - name: Pytest (cross-lib integration)
        run: python -m pytest tests -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9  # matches packageManager in both app manifests

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9  # matches packageManager in both app manifests

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/studio/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build (single-file)
        run: pnpm build

  # Full-repo characterisation gate. Pre-existing violations are baselined;
  # the build fails only when a NEW lint/type diagnostic is introduced.
  quality-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/miniconda3/pkgs
          key: conda-pkgs-${{ runner.os }}-${{ hashFiles('environment.yml') }}
          restore-keys: conda-pkgs-${{ runner.os }}-

      - name: Set up conda env
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          activate-environment: geospatial
          environment-file: environment.yml
          python-version: "3.12"

      - name: Install editable libs and audit tooling
        run: |
          pip install \
            -e libs/geodomain \
            -e libs/geospatial_core \
            -e libs/data_engine \
            -e libs/geolearn \
            -e libs/geomemory \
            -e libs/geoagent \
            -e server \
            pip-audit

      - name: Ruff (full repo, baseline gate)
        run: >-
          python scripts/check_baseline.py
          --baseline scripts/baselines/ruff.txt
          -- ruff check
          libs/geodomain/src libs/geospatial_core/src libs/data_engine/src
          libs/geoagent/src libs/geomemory/src libs/geolearn/src server/src
          --output-format=concise

      - name: Mypy --strict (full repo, baseline gate)
        run: >-
          python scripts/check_baseline.py
          --baseline scripts/baselines/mypy.txt
          -- python scripts/mypy_all.py

      - name: pip-audit
        # Informational until existing advisories are triaged; flip to
        # blocking once the dependency upgrade follow-up lands.
        continue-on-error: true
        run: pip-audit --progress-spinner off

      - name: Audit JS dependencies
        continue-on-error: true
        run: |
          corepack enable
          for app in apps/web apps/studio; do
            echo "::group::pnpm audit — $app"
            (cd "$app" && corepack pnpm audit --audit-level=high) || echo "::warning::audit findings in $app"
            echo "::endgroup::"
          done

  # Published agent baseline: rerun the frozen protocol and enforce that the
  # published numbers cannot silently rot (change: ship-and-measure-agent).
  benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda env
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          activate-environment: geospatial
          environment-file: environment.yml
          python-version: "3.12"

      - name: Install editable libs
        run: pip install -e libs/geodomain -e libs/geospatial_core -e libs/data_engine -e libs/geolearn -e libs/geomemory -e libs/geoagent

      - name: Regenerate baseline into a scratch dir
        run: python scripts/benchmark_agent_baseline.py --out /tmp/geomind-bench

      - name: Regression hook (published numbers + citation invariant)
        run: python -m pytest libs/geomemory/tests/eval/test_published_baseline.py -q --tb=short

  # The project declares Python >=3.10 but CI only ever built 3.12.
  python-floor:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/miniconda3/pkgs
          key: conda-pkgs310-${{ runner.os }}-${{ hashFiles('environment.yml') }}
          restore-keys: conda-pkgs310-${{ runner.os }}-

      - name: Set up conda env (Python 3.10 floor)
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          activate-environment: geospatial
          environment-file: environment.yml
          python-version: "3.10"

      - name: Install editable libs
        run: |
          pip install \
            -e libs/geodomain \
            -e libs/geospatial_core \
            -e libs/data_engine \
            -e libs/geolearn \
            -e libs/geomemory \
            -e libs/geoagent \
            -e server

      - name: Verify floor — imports
        run: python -c "import geomemory, geoagent, geolearn, geodomain, geospatial_core, data_engine, geofront_api; print('Python', __import__('sys').version.split()[0], 'imports OK')"

      - name: Verify floor — core tests
        run: python -m pytest libs/geomemory/tests/unit/test_models.py libs/geoagent/tests -q --tb=short
