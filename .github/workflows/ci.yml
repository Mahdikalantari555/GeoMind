name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        lib: [data_engine, geospatial_core, geomemory, geoagent]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up conda env
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          activate-environment: geospatial
          environment-file: environment.yml
          python-version: "3.12"

      - name: Install editable libs
        run: |
          # Order matters: each lib depends on the ones before it.
          pip install \
            -e libs/geodomain \
            -e libs/geospatial_core \
            -e libs/data_engine \
            -e libs/geolearn \
            -e libs/geomemory \
            -e libs/geoagent

      - name: Ruff on changed files only
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          if ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            BASE="HEAD"
          fi
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- "libs/${{ matrix.lib }}/src" 2>/dev/null | grep '\.py$' || true)
          if [ -n "$CHANGED" ]; then
            echo "Linting:"
            echo "$CHANGED"
            ruff check $CHANGED
          else
            echo "No changed source files in libs/${{ matrix.lib }} — skipping ruff"
          fi

      - name: Mypy on changed files only
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          if ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            BASE="HEAD"
          fi
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- "libs/${{ matrix.lib }}/src" 2>/dev/null | grep '\.py$' || true)
          if [ -n "$CHANGED" ]; then
            echo "Checking:"
            echo "$CHANGED"
            cd libs/${{ matrix.lib }}
            REL=$(echo "$CHANGED" | sed "s#libs/${{ matrix.lib }}/##")
            mypy --strict $REL
          else
            echo "No changed source files in libs/${{ matrix.lib }} — skipping mypy"
          fi

      - name: Pytest
        run: |
          python -m pytest libs/${{ matrix.lib }}/tests -q