name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      # Login shell so conda init (written by setup-miniconda) is sourced
      # and the geospatial env is actually activated on PATH.
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        lib: [data_engine, geospatial_core, geomemory, geoagent]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up conda env
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          activate-environment: geospatial
          environment-file: environment.yml
          python-version: "3.12"

      - name: Install editable libs
        run: |
          # Order matters: each lib depends on the ones before it.
          pip install \
            -e libs/geodomain \
            -e libs/geospatial_core \
            -e libs/data_engine \
            -e libs/geolearn \
            -e libs/geomemory \
            -e libs/geoagent

      - name: Ruff on changed files only
        run: |
          CHANGED=$(git diff --name-only ${{ github.base_ref }}...HEAD -- 'libs/${{ matrix.lib }}/src' | grep '\.py$' || true)
          if [ -z "$CHANGED" ]; then
            echo "No changed source files in libs/${{ matrix.lib }} — skipping ruff"
            exit 0
          fi
          echo "Linting:"
          echo "$CHANGED"
          ruff check $CHANGED

      - name: Mypy on changed files only
        run: |
          CHANGED=$(git diff --name-only ${{ github.base_ref }}...HEAD -- 'libs/${{ matrix.lib }}/src' | grep '\.py$' || true)
          if [ -z "$CHANGED" ]; then
            echo "No changed source files in libs/${{ matrix.lib }} — skipping mypy"
            exit 0
          fi
          echo "Checking:"
          echo "$CHANGED"
          cd libs/${{ matrix.lib }}
          # Strip the libs/<lib>/ prefix so paths are relative to the project root
          REL=$(echo "$CHANGED" | sed "s#libs/${{ matrix.lib }}/##")
          mypy --strict $REL

      - name: Pytest
        run: |
          python -m pytest libs/${{ matrix.lib }}/tests -q