services:
  gateway:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - workspace_data:/workspace
    environment:
      # LLM key — set on host, forwarded into gateway only (never into web)
      GEOMEMORY_LLM_API_KEY: ${GEOMEMORY_LLM_API_KEY:-}
      GEOFOND_WORKSPACE: /workspace
      # Container isolation comes from the published port mapping.
      GEOMIND_BIND: 0.0.0.0
      # Set both tokens for a non-loopback deployment (auth is enabled when
      # GEOMIND_API_TOKEN is non-empty). The admin token guards settings,
      # providers, environment and model-management routes.
      GEOMIND_API_TOKEN: ${GEOMIND_API_TOKEN:-}
      GEOMIND_ADMIN_TOKEN: ${GEOMIND_ADMIN_TOKEN:-}
      GEOMIND_CORS_ORIGINS: ${GEOMIND_CORS_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174}
    # Single writer invariant: exactly one gateway container
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Default demo front — the map-first Studio app.
  studio:
    build:
      context: apps/studio
      dockerfile: Dockerfile
    ports:
      - "5174:80"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  # Frozen admin console — opt-in only (docker compose --profile reference up).
  web:
    profiles: ["reference"]
    build:
      context: apps/web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  workspace_data:
