[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geodomain"
version = "0.1.0"
description = "Pure domain models, identity, observation, and taxonomy contracts for GeoFoundation"
authors = [{ name = "GeoFoundation Team" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
line-length = 100
