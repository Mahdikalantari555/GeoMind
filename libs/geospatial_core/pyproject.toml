[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geospatial_core"
version = "0.1.0"
description = "Authoritative unified geospatial processing engine for remote sensing raster and vector calculations"
authors = [{ name = "GeoFoundation Team" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "rasterio>=1.3",
    "geopandas>=0.13",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[tool.mypy]
strict = true
python_version = "3.12"
disable_error_code = ["import-untyped"]

[tool.ruff]
line-length = 100
