[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoagent"
version = "0.1.0"
description = "Lightweight agent framework over the GeoMemory public API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.0",
  "click>=8.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
memory = ["geomemory"]
rs = ["geolearn", "data-engine"]
dev = ["pytest>=7.0", "ruff"]

[project.scripts]
geoagent = "geoagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["B008", "E501"]  # B008: Field(default_factory=...); E501: long f-string lines in tool definitions

[tool.mypy]
python_version = "3.10"
strict = true
disable_error_code = ["import-untyped"]
exclude = ["tests/", ".worktrees/"]
[[tool.mypy.overrides]]
module = ["geolearn.*", "rasterio.*", "sqlite_vec.*"]
ignore_missing_imports = true
